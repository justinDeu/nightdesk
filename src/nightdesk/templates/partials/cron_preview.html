{% if error %}
  <div class="text-xs text-warn">Invalid schedule: {{ error }}</div>
{% else %}
  <div class="text-xs text-fg-muted">
    <div class="font-medium text-fg mb-1">Next fires ({{ timezone }})</div>
    <ul class="font-mono">
      {% for f in fires %}<li>{{ f }}</li>{% endfor %}
    </ul>
  </div>
{% endif %}
