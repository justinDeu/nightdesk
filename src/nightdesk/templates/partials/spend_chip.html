{# Header spend summary. Rendered into the #spend-chip <a> (links to
   /analytics). Cost is an estimate (see domain/cost.py). #}
<span class="inline-flex items-center gap-1.5">
  <span class="text-fg-muted">$</span>
  <span class="{{ 'text-warn' if status.budget_exceeded else 'text-fg' }}">{{ '%.2f'|format(status.day_spend_usd or 0) }}</span>
  <span class="text-fg-muted">today</span>
  {% if status.budget_exceeded %}
    <span class="text-warn" title="{{ status.budget_reason }}">⚠</span>
  {% endif %}
</span>
