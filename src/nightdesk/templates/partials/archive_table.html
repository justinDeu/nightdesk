<div id="archive-table" class="border border-border rounded-md overflow-hidden">
  {% if rows %}
    <table class="w-full text-sm">
      <thead class="bg-bg-elev text-fg-muted text-xs uppercase tracking-wide">
        <tr class="text-left">
          <th class="px-3 py-2">Title</th>
          <th class="px-3 py-2">Profile</th>
          <th class="px-3 py-2">Outcome</th>
          <th class="px-3 py-2">Finished</th>
          <th class="px-3 py-2">Priority</th>
          <th class="px-3 py-2 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          {% include "partials/archive_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <div class="px-3 py-6 text-center text-fg-muted text-sm">
      No archived tickets match these filters.
    </div>
  {% endif %}
</div>
