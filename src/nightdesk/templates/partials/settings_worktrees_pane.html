<div class="rounded border border-border bg-bg-elev p-5">
  <header class="mb-5 flex items-center gap-3">
    <div class="min-w-0 flex-1">
      <h2 class="text-xl font-semibold text-fg">Git worktrees</h2>
      <p class="mt-1 text-sm text-fg-muted">Set the default branch or ref used when tickets create new worktrees.</p>
    </div>
    {% if saved %}<span class="px-2 py-0.5 text-xs bg-green-900/40 text-green-200 rounded">saved</span>{% endif %}
  </header>

  <form method="post" action="/settings/worktrees" class="flex flex-col gap-5" data-settings-form>
    <section class="border border-border rounded p-4 bg-bg">
      <div class="grid grid-cols-[1fr,16rem] gap-x-3 gap-y-3 text-sm items-center">
        <label for="worktree_base_ref" class="text-fg">
          <div class="font-medium">Default base branch / ref</div>
          <div class="text-xs text-fg-muted">New git-worktree tickets branch from this ref when no explicit base is set. Leave blank to branch from <code>HEAD</code>. Per-ticket values override this.</div>
        </label>
        <input id="worktree_base_ref" name="worktree_base_ref" type="text"
               value="{{ (cfg.worktree_base_ref if cfg else '') or '' }}"
               placeholder="HEAD"
               class="px-2 py-1 bg-bg-elev-2 border border-border rounded text-fg font-mono" />
      </div>
    </section>
    <section class="border border-border rounded p-4 bg-bg">
      <label for="toolchain_presets_json" class="block text-sm text-fg">
        <div class="font-medium">Global external tool presets</div>
        <div class="mb-2 text-xs text-fg-muted">JSON object mapping preset names to host bin directory lists. Projects choose which external tool presets to enable.</div>
      </label>
      <textarea id="toolchain_presets_json"
                name="toolchain_presets_json"
                rows="6"
                class="w-full px-2 py-1 bg-bg-elev-2 border border-border rounded text-fg font-mono text-xs"
                placeholder='{"go-user-tools":["~/go/bin"]}'>{{ (cfg.toolchain_presets or {}) | tojson }}</textarea>
    </section>
    <div class="flex justify-end gap-2">
      <button type="submit" class="px-4 py-1 bg-accent text-bg rounded hover:opacity-90 font-medium">Save worktree settings</button>
    </div>
  </form>
</div>
